<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- 右側半閉眼專用裁切遮罩 -->
    <clipPath id="clip-half-eye-1">
      <path d="M 11 13.5 C 13.8 12.2, 19.5 12.2, 22.5 13.5 C 19.5 17.5, 13.8 17.5, 11 13.5 Z" />
    </clipPath>
  </defs>

  <!-- === 左側：極簡指向天空的鋼筆 (已移除脖子橫線，一體流暢) === -->
  <!-- 鋼筆外廓線條 -->
  <path d="M 5 3 L 3.2 8.5 L 3.8 11.5 L 3.8 21" />
  <path d="M 5 3 L 6.8 8.5 L 6.2 11.5 L 6.2 21" />
  <line x1="3.8" y1="21" x2="6.2" y2="21" />

  <!-- 筆尖墨水縫與單純圓形呼吸孔 -->
  <line x1="5" y1="3" x2="5" y2="8" />
  <circle cx="5" cy="8.6" r="0.6" stroke="#ffffff" stroke-width="0.9" fill="none" />

  <!-- === 右側：純粹半閉之眼 === -->
  <g clip-path="url(#clip-half-eye-1)">
    <circle cx="16.8" cy="14.2" r="3.2" stroke="#ffffff" stroke-width="0.9" fill="none" />
    <circle cx="16.8" cy="14.2" r="1.3" stroke="#ffffff" stroke-width="0.9" fill="none" />
  </g>

  <!-- 向下壓低的上眼皮與飽滿下眼皮 -->
  <path d="M 11 13.5 C 13.8 12.2, 19.5 12.2, 22.5 13.5" />
  <path d="M 11 13.5 C 13.8 17.5, 19.5 17.5, 22.5 13.5" />
</svg>
