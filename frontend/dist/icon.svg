<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <defs>
    <!-- Inward half-closed eye clip path -->
    <clipPath id="clip-half-eye-1">
      <path d="M 11 13.5 C 13.8 12.2, 19.5 12.2, 22.5 13.5 C 19.5 17.5, 13.8 17.5, 11 13.5 Z" />
    </clipPath>
  </defs>

  <!-- Deep dark rounded container background -->
  <rect width="24" height="24" rx="5" fill="#121212" />
  <rect width="23" height="23" x="0.5" y="0.5" rx="4.5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.6" />

  <!-- Pen & Eye line art in pure white -->
  <g stroke="#ffffff" stroke-width="0.95" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left: Minimalist upward fountain pen -->
    <path d="M 5 3 L 3.2 8.5 L 3.8 11.5 L 3.8 21" />
    <path d="M 5 3 L 6.8 8.5 L 6.2 11.5 L 6.2 21" />
    <line x1="3.8" y1="21" x2="6.2" y2="21" />

    <!-- Nib slit and breather hole -->
    <line x1="5" y1="3" x2="5" y2="8" />
    <circle cx="5" cy="8.6" r="0.6" stroke-width="0.95" fill="none" />

    <!-- Right: Inward half-closed eye -->
    <g clip-path="url(#clip-half-eye-1)">
      <circle cx="16.8" cy="14.2" r="3.2" stroke-width="0.95" fill="none" />
      <circle cx="16.8" cy="14.2" r="1.3" stroke-width="0.95" fill="none" />
    </g>

    <!-- Eyelid contours -->
    <path d="M 11 13.5 C 13.8 12.2, 19.5 12.2, 22.5 13.5" />
    <path d="M 11 13.5 C 13.8 17.5, 19.5 17.5, 22.5 13.5" />
  </g>
</svg>
